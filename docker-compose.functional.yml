name: ydisks-xianyu-helper-functional

x-mysql-url: &mysql-url mysql://root:xianyu_root_password@tcp(mysql:3306)/xianyu?parseTime=true&loc=UTC
x-postgres-url: &postgres-url postgres://xianyu:xianyu_postgres_password@postgres:5432/xianyu?sslmode=disable&timezone=UTC
x-data-key: &data-key docker-functional-data-key-v1

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: xianyu_root_password
      MYSQL_DATABASE: xianyu
      MYSQL_USER: xianyu
      MYSQL_PASSWORD: xianyu_mysql_password
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    ports:
      - "13306:3306"
    volumes:
      - mysql8_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: xianyu
      POSTGRES_USER: xianyu
      POSTGRES_PASSWORD: xianyu_postgres_password
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    ports:
      - "15432:5432"
    volumes:
      - postgres17_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  sqlite-seed-copy:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: sqlite-tools
    restart: "no"
    volumes:
      - ./data:/source:ro
      - sqlite_seed:/seed
    command:
      - /bin/sh
      - -ec
      - |
        rm -f /seed/xianyu_data.db /seed/xianyu_data.db-wal /seed/xianyu_data.db-shm
        test -f /source/xianyu_data.db
        sqlite3 -readonly /source/xianyu_data.db ".timeout 30000" ".backup '/seed/xianyu_data.db'"
        test -s /seed/xianyu_data.db
        test "$(sqlite3 /seed/xianyu_data.db 'PRAGMA journal_mode=DELETE;')" = "delete"
        sqlite3 /seed/xianyu_data.db "PRAGMA quick_check" | grep -qx ok

  seed-mysql:
    image: ydisks-xianyu-helper:functional
    build:
      context: .
      dockerfile: Dockerfile.debian13
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
      sqlite-seed-copy:
        condition: service_completed_successfully
    volumes:
      - sqlite_seed:/seed:ro
    environment:
      XIANYU_DATA_KEY: *data-key
    command: ["/app/xianyu-dbseed", "-source", "/seed/xianyu_data.db", "-target", *mysql-url, "-limit", "20"]

  seed-sqlite:
    image: ydisks-xianyu-helper:functional
    build:
      context: .
      dockerfile: Dockerfile.debian13
    restart: "no"
    depends_on:
      sqlite-seed-copy:
        condition: service_completed_successfully
    environment:
      XIANYU_DATA_KEY: *data-key
    volumes:
      - sqlite_seed:/seed:ro
      - app_sqlite_data:/app/data
    command: ["/app/xianyu-dbseed", "-source", "/seed/xianyu_data.db", "-target", "/app/data/xianyu-functional.db", "-limit", "20"]

  seed-postgres:
    image: ydisks-xianyu-helper:functional
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      sqlite-seed-copy:
        condition: service_completed_successfully
    volumes:
      - sqlite_seed:/seed:ro
    environment:
      XIANYU_DATA_KEY: *data-key
    command: ["/app/xianyu-dbseed", "-source", "/seed/xianyu_data.db", "-target", *postgres-url, "-limit", "20"]

  app-mysql:
    image: ydisks-xianyu-helper:functional
    restart: unless-stopped
    depends_on:
      seed-mysql:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: *mysql-url
      XIANYU_DATA_KEY: *data-key
      TZ: Asia/Shanghai
    command: ["/app/xianyu-server", "-addr", ":8080", "-no-browser"]
    ports:
      - "28081:8080"
    volumes:
      - app_mysql_data:/app/data
      - app_mysql_browser_data:/app/browser_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  app-sqlite:
    image: ydisks-xianyu-helper:functional
    restart: unless-stopped
    depends_on:
      seed-sqlite:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: sqlite:///app/data/xianyu-functional.db
      XIANYU_DATA_KEY: *data-key
      TZ: Asia/Shanghai
    command: ["/app/xianyu-server", "-addr", ":8080", "-no-browser"]
    ports:
      - "28080:8080"
    volumes:
      - app_sqlite_data:/app/data
      - app_sqlite_browser_data:/app/browser_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  app-postgres:
    image: ydisks-xianyu-helper:functional
    restart: unless-stopped
    depends_on:
      seed-postgres:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: *postgres-url
      XIANYU_DATA_KEY: *data-key
      TZ: Asia/Shanghai
    command: ["/app/xianyu-server", "-addr", ":8080", "-no-browser"]
    ports:
      - "28082:8080"
    volumes:
      - app_postgres_data:/app/data
      - app_postgres_browser_data:/app/browser_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  go-test:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: go-test
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      TEST_MYSQL_URL: *mysql-url
      TEST_POSTGRES_URL: *postgres-url
    command: ["go", "test", "-race", "-timeout=20m", "./..."]

  browser-integration-test:
    build:
      context: .
      dockerfile: Dockerfile.browser-test
    environment:
      RUN_BROWSER_INTEGRATION: "1"
      BROWSER_HEADLESS: "true"
    command: ["go", "test", "-timeout=2m", "./internal/browser", "-run", "TestTokenCaptchaCDPFallbackBrowserIntegration", "-v", "-count=1"]

  go-vet:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: go-test
    command: ["go", "vet", "./..."]

  go-lint:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: go-lint
    command: ["golangci-lint", "run", "./..."]

  frontend-test:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: frontend-test
    command: ["sh", "-c", "npm run typecheck && npm test && npm run build"]

  dbverify-mysql:
    image: ydisks-xianyu-helper:functional
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      XIANYU_DATA_KEY: *data-key
    command: ["/app/xianyu-dbverify", *mysql-url]

  dbverify-sqlite:
    image: ydisks-xianyu-helper:functional
    environment:
      XIANYU_DATA_KEY: *data-key
    volumes:
      - sqlite_verify_data:/app/data
    command: ["/app/xianyu-dbverify", "/app/data/verify.db"]

  dbverify-postgres:
    image: ydisks-xianyu-helper:functional
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      XIANYU_DATA_KEY: *data-key
    command: ["/app/xianyu-dbverify", *postgres-url]

  functional-test:
    image: ydisks-xianyu-helper:functional
    restart: "no"
    depends_on:
      app-sqlite:
        condition: service_healthy
      app-mysql:
        condition: service_healthy
      app-postgres:
        condition: service_healthy
    volumes:
      - ./scripts/docker-functional-test.sh:/tests/docker-functional-test.sh:ro
    entrypoint: ["/bin/sh", "/tests/docker-functional-test.sh"]

volumes:
  mysql8_data:
  postgres17_data:
  sqlite_seed:
  sqlite_verify_data:
  app_sqlite_data:
  app_mysql_data:
  app_postgres_data:
  app_mysql_browser_data:
  app_postgres_browser_data:
  app_sqlite_browser_data:
