openapi: 3.0.3
info:
  title: 闲鱼 MTOP H5 接口文档（Ydisks 闲鱼助手实际调用面）
  version: 1.0.0
  description: |
    本文档整理 Ydisks 闲鱼助手**实际调用**的全部闲鱼 / 淘系 MTOP H5 网关接口，内容来自 `internal/xianyu/mtop`
    与 `internal/xianyu/qrlogin` 的请求构造与响应解析代码，并非平台官方文档。

    > 这是**平台上游接口**的逆向整理，不是本项目对外提供的 HTTP API。项目自身 `/api/v1/**` 的唯一契约是
    > `api/openapi.yaml`，两者互不替代。响应 Schema 只列出代码实际读取的字段，其余字段一律视为"平台可能返回、
    > 本项目不使用"（`additionalProperties: true`）。

    ## 统一调用约定

    所有 MTOP 接口：

    - 主机 `https://h5api.m.goofish.com`，路径 `/h5/{api}/{version}/`，方法 **POST**。
    - 业务参数是一段 JSON，序列化后放入 `application/x-www-form-urlencoded` 表单的 `data` 字段
      （本文档用 `encoding.data.contentType: application/json` 表示该字段内容是 JSON）。
    - 网关参数（`jsv`、`appKey`、`t`、`sign`、`v`、`type`、`api` 等）放在 URL query。
    - 鉴权依赖整串登录 Cookie（至少含 `unb`、`_m_h5_tk`）；响应会通过 `Set-Cookie` 轮换 `_m_h5_tk`，
      客户端必须合并回本地凭证。

    ### 签名算法

    ```
    sign = MD5( token + "&" + t + "&" + appKey + "&" + data )
    ```

    - `token`：Cookie `_m_h5_tk` 的值取第一个 `_` 之前的部分。
    - `t`：Unix 毫秒时间戳字符串，与 query 中的 `t` 一致。
    - `appKey`：固定 `34839810`。
    - `data`：表单 `data` 字段**未做 URL 编码**的原始 JSON 文本；签名只覆盖这四项，**与 URL query 其余参数无关**。

    唯一例外：令牌接口请求体中的 `appKey` 是 WebSocket 注册用的 `444e9908a51d1cb236a27862abc769c9`，
    与签名 appKey 不同，见 `/h5/mtop.taobao.idlemessage.pc.login.token/1.0/`。

    ### 响应信封与 `ret` 判定

    HTTP 200 的响应体统一为 `{"ret": [...], "data": {...}}`。**成功只能由 `ret` 判定**：

    | 类别 | `ret` 特征（不区分大小写的子串匹配） | 项目内处理 |
    | --- | --- | --- |
    | 成功 | 含 `SUCCESS::调用成功`（仅令牌接口放宽为含 `SUCCESS` 即可） | 正常解析 `data` |
    | 签名 Token 过期 | `FAIL_SYS_TOKEN_EXOIRED`（平台拼写）、`FAIL_SYS_TOKEN_EXPIRED`、`FAIL_SYS_TOKEN_EMPTY` | 取响应 `Set-Cookie` 的新 `_m_h5_tk` 重签重试，必要时调用令牌接口 |
    | Session 失效 | 含 `SESSION_EXPIRED`、`SID_INVALID`、`AUTH_REJECT`、`NEED_LOGIN`、`Session过期`、`会话过期` | 立即停止重试，转账号级凭证恢复 / 重新扫码 |
    | 风控 | 含 `FAIL_SYS_USER_VALIDATE`、`RGV587`、`punish`、`captcha`、`x5secdata` | 立即终止整个批次，不得自动重放 |
    | 业务拒绝 | 含 `FAIL_BIZ_` 前缀 | 终态业务结果，不重试 |
    | 其他 | 其余 `FAIL_SYS_*` 等 | 按暂时性系统错误处理 |

    非 2xx 的 HTTP 状态一律视为失败；若 `ret` 带 `FAIL_BIZ_` 业务码，确认发货 / 免拼接口仍按业务结果返回。
    响应体上限 8 MiB。

    ### 请求频率约束（防风控，不可放宽）

    - 所有请求经账号级节流器：同账号请求起点间隔 **≥ 2 秒 + 0~1 秒随机抖动**；后台批量任务
      （订单详情补全、评价、擦亮等）标记后台节流，间隔 **≥ 5 秒**。
    - 一次用户操作或一次调度扫描最多对应一次（或极少量、有上限的）平台请求；禁止"列表 × 每项一次请求"的扇出。
    - 遇到风控 / Session 过期 / Token 耗尽必须立即终止当前批次。
    - 签名 Token 过期的重试：确认发货 / 免拼 / 改价 / 聊天商品 / 订单列表最多 4 次尝试（含首次），
      间隔 1 秒；令牌接口最多 5 次；账号任务接口最多 3 次；订单详情最多 2 次。

    ### 通用请求头

    `accept: application/json`、`content-type: application/x-www-form-urlencoded`、
    `origin: https://www.goofish.com`、`referer`（各接口不同，见下）、`cookie`，以及浏览器指纹类头
    （`user-agent`、`sec-ch-ua*`、`sec-fetch-*`、`accept-language` 等）。
  contact:
    name: Ydisks 闲鱼助手
    url: https://github.com/Ydisks/Ydisks-Xianyu-Helper
servers:
  - url: https://h5api.m.goofish.com
    description: 闲鱼 MTOP H5 网关（生产）
tags:
  - name: 凭证与登录态
    description: 令牌、登录态检测、二维码登录辅助。
  - name: 订单与发货
    description: 订单详情、已售订单、确认发货、免拼、改价。
  - name: 商品
    description: 商品列表、聊天内商品搜索、擦亮。
  - name: 发布
    description: 类目推荐、图片上传、商品发布。
  - name: 评价
    description: 待评价订单与买家评价。
  - name: 账号与会话
    description: 账号资料、会话对端用户。
paths:
  /h5/mtop.taobao.idlemessage.pc.login.token/1.0/:
    post:
      tags: [凭证与登录态]
      operationId: loginToken
      summary: 获取 IM accessToken（mtop.taobao.idlemessage.pc.login.token）
      description: |
        用 Cookie 换取 WebSocket `/reg` 注册所需的 `accessToken`。请求体里的 `deviceId` 必须与随后 WS `/reg` 的
        `headers.did` 完全一致，否则 `/reg` 返回 `device id or appkey is not equal`。
        `deviceId` 缺省时由 `unb` 派生；Cookie 缺少 `unb` 时无法构造请求。

        遇到签名 Token 过期按官网 lib-mtop 2.7.3 流程最多请求 5 次（含首次），每次吸收响应 Cookie 后重签；
        第 5 次仍失败会清除 `_m_h5_c`、`_m_h5_tk`、`_m_h5_tk_enc` 三个 Cookie。
        `ret` 不含 `SUCCESS` 且 `data.url` 非空时，`data.url` 是风控验证链接，供滑块 / 人脸验证使用。

        Referer: '`https://www.goofish.com/im`。'
      parameters:
        - $ref: '#/components/parameters/Jsv'
        - $ref: '#/components/parameters/AppKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Sign'
        - $ref: '#/components/parameters/AccountSite'
        - $ref: '#/components/parameters/DataType'
        - $ref: '#/components/parameters/Timeout20000'
        - $ref: '#/components/parameters/SessionOptionAutoLoginOnly'
        - { name: v, in: query, required: true, schema: { type: string, enum: ['1.0'] } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [originaljson] } }
        - { name: api, in: query, required: true, schema: { type: string, enum: [mtop.taobao.idlemessage.pc.login.token] } }
        - { name: needLoginPC, in: query, required: true, schema: { type: string, enum: ['false'] } }
        - { name: showErrorToast, in: query, required: true, schema: { type: string, enum: ['false'] } }
        - { name: needLogin, in: query, required: true, schema: { type: string, enum: ['false'] } }
        - { name: ecode, in: query, required: true, schema: { type: string, enum: ['0'] } }
        - name: dangerouslySetWindvaneParams
          in: query
          required: true
          description: 固定值 `[object Object]`（已是单次编码，原样拼接，不再二次编码）。
          schema: { type: string, enum: ['%5Bobject%20Object%5D'] }
        - { name: spm_cnt, in: query, required: true, schema: { type: string, enum: [a21ybx.im.0.0] } }
        - { name: spm_pre, in: query, required: true, description: 固定为空串。, schema: { type: string, enum: [''] } }
        - { name: log_id, in: query, required: true, description: 固定为空串。, schema: { type: string, enum: [''] } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/LoginTokenRequestData'
            encoding:
              data: { contentType: application/json }
      responses:
        '200':
          description: 业务结果以 `ret` 判定。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MtopEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginTokenResponseData' }
        default: { $ref: '#/components/responses/GatewayError' }
      security: [{ cookieAuth: [] }]
      x-rate-limit: 账号级节流，间隔 ≥2s + 抖动；Token 过期最多 5 次尝试。

  /h5/mtop.taobao.idlemessage.pc.loginuser.get/1.0/:
    post:
      tags: [凭证与登录态]
      operationId: loginUserGet
      summary: 轻量登录态检测（mtop.taobao.idlemessage.pc.loginuser.get）
      description: |
        请求体恒为 `{}`。用于确认 Session 是否仍有效，不返回业务数据。项目把 `ret` 归类为：
        `success`（含 SUCCESS）、`token_refreshed`（TOKEN_EMPTY 且响应已下发新 `_m_h5_tk`）、
        `token_empty`、`session_expired`、`risk_required`、`failed`。
        风控时 `data.url` 为验证链接。Referer: `https://www.goofish.com/im`。
      parameters:
        - $ref: '#/components/parameters/Jsv'
        - $ref: '#/components/parameters/AppKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Sign'
        - $ref: '#/components/parameters/AccountSite'
        - $ref: '#/components/parameters/DataType'
        - $ref: '#/components/parameters/Timeout20000'
        - $ref: '#/components/parameters/SessionOptionAutoLoginOnly'
        - { name: v, in: query, required: true, schema: { type: string, enum: ['1.0'] } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [originaljson] } }
        - { name: api, in: query, required: true, schema: { type: string, enum: [mtop.taobao.idlemessage.pc.loginuser.get] } }
        - { name: spm_cnt, in: query, required: true, schema: { type: string, enum: [a21ybx.im.0.0] } }
        - { name: spm_pre, in: query, required: true, schema: { type: string, enum: [a21ybx.item.want.1.12523da6waCtUp] } }
        - { name: log_id, in: query, required: true, schema: { type: string, enum: [12523da6waCtUp] } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/components/schemas/EmptyRequestData' }
            encoding:
              data: { contentType: application/json }
      responses:
        '200':
          description: 业务结果以 `ret` 判定。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MtopEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true
                        properties:
                          url:
                            type: string
                            description: 风控时的安全验证链接。
        default: { $ref: '#/components/responses/GatewayError' }
      security: [{ cookieAuth: [] }]
      x-rate-limit: 账号级节流；仅在 TOKEN_EMPTY 时额外调用一次令牌接口后重查一次。

  /h5/mtop.gaia.nodejs.gaia.idle.data.gw.v2.index.get/1.0/:
    post:
      tags: [凭证与登录态]
      operationId: gaiaIndexGet
      summary: 扫码登录后获取 _m_h5_tk（mtop.gaia.nodejs.gaia.idle.data.gw.v2.index.get）
      description: |
        仅用于二维码登录收尾：为新会话换取 `_m_h5_tk` 签名 Cookie。**业务参数放在 query 的 `data` 中，请求体为空**，
        响应内容被丢弃，项目只关心响应 `Set-Cookie`。该调用不带 `accountSite`、`sessionOption`，
        也不经 `mtop.Client`（位于 `internal/xianyu/qrlogin`）。

        签名 `token` 取会话 Cookie `_m_h5_tk` 的 `_` 前半段，算法同顶部"签名算法"。
      parameters:
        - $ref: '#/components/parameters/Jsv'
        - $ref: '#/components/parameters/AppKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Sign'
        - $ref: '#/components/parameters/DataType'
        - $ref: '#/components/parameters/Timeout20000'
        - { name: v, in: query, required: true, schema: { type: string, enum: ['1.0'] } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [originaljson] } }
        - { name: api, in: query, required: true, schema: { type: string, enum: [mtop.gaia.nodejs.gaia.idle.data.gw.v2.index.get] } }
        - name: data
          in: query
          required: true
          description: 固定 JSON 文本 `{"bizScene":"home"}`，参与签名。
          schema: { type: string, enum: ['{"bizScene":"home"}'] }
      responses:
        '200':
          description: 响应体不被解析，仅吸收 `Set-Cookie`。
          headers:
            Set-Cookie:
              description: 下发 `_m_h5_tk`、`_m_h5_tk_enc` 等签名 Cookie。
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MtopEnvelope' }
        default: { $ref: '#/components/responses/GatewayError' }
      security: [{ cookieAuth: [] }]

  /h5/mtop.idle.web.user.page.nav/1.0/:
    post:
      tags: [账号与会话]
      operationId: userPageNav
      summary: 当前登录账号资料（mtop.idle.web.user.page.nav）
      description: '请求体恒为 `{}`。读取昵称与头像。Referer: `https://www.goofish.com/`。'
      parameters:
        - $ref: '#/components/parameters/Jsv'
        - $ref: '#/components/parameters/AppKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Sign'
        - $ref: '#/components/parameters/AccountSite'
        - $ref: '#/components/parameters/DataType'
        - $ref: '#/components/parameters/Timeout20000'
        - $ref: '#/components/parameters/SessionOptionAutoLoginOnly'
        - { name: v, in: query, required: true, schema: { type: string, enum: ['1.0'] } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [originaljson] } }
        - { name: api, in: query, required: true, schema: { type: string, enum: [mtop.idle.web.user.page.nav] } }
        - { name: ecode, in: query, required: true, schema: { type: string, enum: ['0'] } }
        - { name: spm_cnt, in: query, required: true, schema: { type: string, enum: [a21ybx.home.0.0] } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/components/schemas/EmptyRequestData' }
            encoding:
              data: { contentType: application/json }
      responses:
        '200':
          description: 业务结果以 `ret` 判定。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MtopEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserPageNavData' }
        default: { $ref: '#/components/responses/GatewayError' }
      security: [{ cookieAuth: [] }]
      x-rate-limit: 一次用户操作一次请求。

  /h5/mtop.taobao.idlemessage.pc.user.query/4.0/:
    post:
      tags: [账号与会话]
      operationId: chatUserQuery
      summary: 会话对端用户信息（mtop.taobao.idlemessage.pc.user.query）
      description: |
        按**会话 ID**（不是用户 ID）查询会话对端的昵称与头像。Referer / Origin 为 `https://www.goofish.com/`。
        该接口与账号任务接口共用同一请求实现（最多 3 次尝试，Token 过期时重签）。
      parameters:
        - $ref: '#/components/parameters/Jsv'
        - $ref: '#/components/parameters/AppKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Sign'
        - $ref: '#/components/parameters/AccountSite'
        - $ref: '#/components/parameters/DataType'
        - $ref: '#/components/parameters/Timeout20000'
        - $ref: '#/components/parameters/SessionOptionAutoLoginOnly'
        - { name: v, in: query, required: true, schema: { type: string, enum: ['4.0'] } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [originaljson] } }
        - { name: api, in: query, required: true, schema: { type: string, enum: [mtop.taobao.idlemessage.pc.user.query] } }
        - { name: spm_cnt, in: query, required: true, schema: { type: string, enum: [a21ybx.im.0.0] } }
        - { name: spm_pre, in: query, required: true, schema: { type: string, enum: [a21ybx.home.sidebar.2.4c053da6MpVe1m] } }
        - { name: log_id, in: query, required: true, schema: { type: string, enum: [4c053da6MpVe1m] } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/components/schemas/ChatUserQueryRequestData' }
            encoding:
              data: { contentType: application/json }
      responses:
        '200':
          description: 业务结果以 `ret` 判定；成功但缺少 `data.userInfo` 视为异常。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MtopEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ChatUserQueryData' }
        default: { $ref: '#/components/responses/GatewayError' }
      security: [{ cookieAuth: [] }]
      x-rate-limit: 一次用户操作一次请求。

  /h5/mtop.idle.web.trade.order.detail/1.0/:
    post:
      tags: [订单与发货]
      operationId: orderDetail
      summary: 卖家订单详情（mtop.idle.web.trade.order.detail）
      description: |
        按订单号读取成交金额、数量、订单状态与成交规格，供自动发货的金额门禁与多规格匹配使用。
        Referer: '`https://www.goofish.com/order-detail?orderId={orderId}&role=seller`。'

        响应 `data` 的容器类型和层级随账号、订单状态与页面版本变化，项目**递归扫描**整个 `data`
        （含二次编码为 JSON 文本的字符串，最大深度 12）并提取：

        - `utArgs.orderStatus` → 订单状态（取第一个非空）；
        - 任意 `itemInfo` 节点或带 SKU 字段的节点 → `buyAmount`（数量）与成交规格；
        - `priceInfo.amount.value` → 成交金额（取第一个非空）。

        平台未返回 `buyAmount` 时数量保持为空，**绝不默认成 1**。成交金额 `0`（如服务预约单）由自动发货的金额门禁拦截。
        规格字段兼容多种键名（见 `OrderDetailItemInfo`），多维规格以中文分号 `；` 连接。
        该接口由订单详情协调器额外限速，严于通用节流。
      parameters:
        - $ref: '#/components/parameters/Jsv'
        - $ref: '#/components/parameters/AppKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Sign'
        - $ref: '#/components/parameters/AccountSite'
        - $ref: '#/components/parameters/DataType'
        - $ref: '#/components/parameters/Timeout20000'
        - $ref: '#/components/parameters/SessionOptionAutoLoginOnly'
        - { name: v, in: query, required: true, schema: { type: string, enum: ['1.0'] } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [originaljson] } }
        - { name: api, in: query, required: true, schema: { type: string, enum: [mtop.idle.web.trade.order.detail] } }
        - $ref: '#/components/parameters/ValueTypeString'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/components/schemas/OrderDetailRequestData' }
            encoding:
              data: { contentType: application/json }
      responses:
        '200':
          description: 业务结果以 `ret` 判定。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MtopEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderDetailData' }
        default: { $ref: '#/components/responses/GatewayError' }
      security: [{ cookieAuth: [] }]
      x-rate-limit: 后台批量使用后台节流（≥5s）；Token 过期最多 2 次请求；风控 / Session 失效立即上抛。

  /h5/mtop.taobao.idle.trade.merchant.sold.get/1.0/:
    post:
      tags: [订单与发货]
      operationId: soldOrdersGet
      summary: 卖家已售订单列表（mtop.taobao.idle.trade.merchant.sold.get）
