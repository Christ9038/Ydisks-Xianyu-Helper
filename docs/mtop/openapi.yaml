        - $ref: '#/components/parameters/Sign'
        - $ref: '#/components/parameters/AccountSite'
        - $ref: '#/components/parameters/DataType'
        - $ref: '#/components/parameters/Timeout20000'
        - $ref: '#/components/parameters/SessionOptionAutoLoginOnly'
        - { name: v, in: query, required: true, schema: { type: string, enum: ['4.0'] } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [originaljson] } }
        - { name: api, in: query, required: true, schema: { type: string, enum: [mtop.taobao.idle.rate.create] } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/components/schemas/RateCreateRequestData' }
            encoding:
              data: { contentType: application/json }
      responses:
        '200':
          description: 业务结果以 `ret` 判定，无需解析 `data`。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MtopEnvelope' }
        default: { $ref: '#/components/responses/GatewayError' }
      security: [{ cookieAuth: [] }]
      x-rate-limit: 后台节流 ≥5s；批量评价遇风控立即终止整批。

  /h5/mtop.taobao.idle.kgraph.property.recommend/2.0/:
    post:
      tags: [发布]
      operationId: kgraphPropertyRecommend
      summary: 发布类目推荐（mtop.taobao.idle.kgraph.property.recommend）
      description: |
        按标题 / 描述 / 图片推荐商品类目。成功响应的 `data.categoryPredictResult` 必须同时具备
        `catId`、`catName`、`channelCatId`，否则尝试从 `data.cardList` 中 `propertyId="-10000"` 且 `isClicked`
        的分类卡补全；仍无效则判为"类目无法识别"，调用方回退到默认虚拟类目
        （`catId=50023914`、`catName=电子资料`、`channelCatId=202036301`）。
        Referer: '`https://www.goofish.com/`。'
      parameters:
        - $ref: '#/components/parameters/Jsv'
        - $ref: '#/components/parameters/AppKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Sign'
        - $ref: '#/components/parameters/AccountSite'
        - $ref: '#/components/parameters/DataType'
        - $ref: '#/components/parameters/Timeout20000'
        - $ref: '#/components/parameters/SessionOptionAutoLoginOnly'
        - { name: v, in: query, required: true, schema: { type: string, enum: ['2.0'] } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [originaljson] } }
        - { name: api, in: query, required: true, schema: { type: string, enum: [mtop.taobao.idle.kgraph.property.recommend] } }
        - { name: spm_cnt, in: query, required: true, schema: { type: string, enum: [a21ybx.publish.0.0] } }
        - { name: spm_pre, in: query, required: true, schema: { type: string, enum: [a21ybx.item.sidebar.1.67321598K9Vgx8] } }
        - { name: log_id, in: query, required: true, schema: { type: string, enum: [67321598K9Vgx8] } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/components/schemas/RecommendRequestData' }
            encoding:
              data: { contentType: application/json }
      responses:
        '200':
          description: 业务结果以 `ret` 判定。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MtopEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RecommendData' }
        default: { $ref: '#/components/responses/GatewayError' }
      security: [{ cookieAuth: [] }]
      x-rate-limit: 每次发布一次请求。

  /h5/mtop.idle.pc.idleitem.publish/1.0/:
    post:
      tags: [发布]
      operationId: idleItemPublish
      summary: 发布商品（mtop.idle.pc.idleitem.publish）
      description: |
        发布单规格或多规格商品。多规格时 `itemPriceDTO` 不含 `priceInCent`（价格由 `itemSkuList` 逐行给出），
        并附带 `itemProperties`、`itemSkuList`，有规格图时附带 `propertyImageList`。规格约束（由项目在请求前校验）：
        规格类型最多 2 个、每个至少 2 个规格值、组合数 ≤1500、SKU 价格 / 库存 >0。
        实物商品必须带 `itemAddrDTO`（发货地）；虚拟商品可省略。

        项目对失败的分类：含 token / login / session 关键字 → `auth_expired`；同时包含"库存/数量/quantity/stock"
        与"权限/未开通/不支持/permission/forbidden"关键字 → `stock_permission_missing`；其余 → `publish_failed`。
        成功后 `itemId` 在 `data` 中按 `itemId | item_id | id | itemID` 深度查找，商品链接为
        `https://www.goofish.com/item?id={itemId}`。Referer: `https://www.goofish.com/`。
      parameters:
        - $ref: '#/components/parameters/Jsv'
        - $ref: '#/components/parameters/AppKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Sign'
        - $ref: '#/components/parameters/AccountSite'
        - $ref: '#/components/parameters/DataType'
        - $ref: '#/components/parameters/Timeout20000'
        - $ref: '#/components/parameters/SessionOptionAutoLoginOnly'
        - { name: v, in: query, required: true, schema: { type: string, enum: ['1.0'] } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [originaljson] } }
        - { name: api, in: query, required: true, schema: { type: string, enum: [mtop.idle.pc.idleitem.publish] } }
        - { name: spm_cnt, in: query, required: true, schema: { type: string, enum: [a21ybx.publish.0.0] } }
        - { name: spm_pre, in: query, required: true, schema: { type: string, enum: [a21ybx.home.sidebar.1.46413da6EPl7v5] } }
        - { name: log_id, in: query, required: true, schema: { type: string, enum: [46413da6EPl7v5] } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/components/schemas/PublishRequestData' }
            encoding:
              data: { contentType: application/json }
      responses:
        '200':
          description: 业务结果以 `ret` 判定。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MtopEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true
                        description: 含新商品 ID，键名不固定，见接口说明。
        default: { $ref: '#/components/responses/GatewayError' }
      security: [{ cookieAuth: [] }]
      x-rate-limit: 一次发布一次请求；批量发布必须由调用方限制数量并在风控时终止。

  /api/upload.api:
    servers:
      - url: https://stream-upload.goofish.com
        description: 闲鱼图片上传网关（非 h5api 主机，不使用 MTOP 签名）
    post:
      tags: [发布]
      operationId: streamUploadImage
      summary: 上传商品 / 聊天图片（stream-upload.goofish.com/api/upload.api）
      description: |
        **不是 MTOP 接口**，但与发布、聊天发图共用 Cookie 与同一节流 / 日志传输层，故一并整理。
        multipart 表单字段 `file` 为图片；不使用 MTOP 签名，也不带 `content-type: x-www-form-urlencoded`。
        成功响应的图片地址取 `object.url`，缺失时依次回退 `data.url`、顶层 `url`；
        宽高取 `object.pix`（形如 `800x600`），缺失时项目用图片自身尺寸，仍缺失则默认 800×800。
        HTTP 非 2xx 视为失败。Referer: `https://www.goofish.com/`。
      parameters:
        - { name: floderId, in: query, required: true, description: 平台字段拼写即 `floderId`（非 folderId）。, schema: { type: string, enum: ['0'] } }
        - { name: appkey, in: query, required: true, schema: { type: string, enum: [xy_chat] } }
        - { name: _input_charset, in: query, required: true, schema: { type: string, enum: [utf-8] } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 图片二进制。
      responses:
        '200':
          description: 上传结果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadImageResponse' }
        default:
          description: 非 2xx 状态视为上传失败。
      security: [{ cookieAuth: [] }]

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: header
      name: Cookie
      description: |
        整串登录 Cookie（至少含 `unb`、`_m_h5_tk`）。Cookie 属于敏感凭证，不得写入日志、通知或测试输出。
        签名只取其中 `_m_h5_tk` 的前半段（`_` 之前）。

  parameters:
    Jsv:
      name: jsv
      in: query
      required: true
      description: MTOP JS SDK 版本，固定 `2.7.2`。
      schema: { type: string, enum: ['2.7.2'] }
    AppKey:
      name: appKey
      in: query
      required: true
      description: 签名用 appKey，固定 `34839810`（与 WS 注册 appKey 不同）。
      schema: { type: string, enum: ['34839810'] }
    Timestamp:
      name: t
      in: query
      required: true
      description: Unix 毫秒时间戳字符串，须与签名输入一致。
      schema: { type: string, pattern: '^[0-9]{13}$', example: '1767225600000' }
    Sign:
      name: sign
      in: query
      required: true
      description: '`MD5(token&t&appKey&data)` 的 32 位小写十六进制，见文档顶部"签名算法"。'
      schema: { type: string, pattern: '^[0-9a-f]{32}$' }
    AccountSite:
      name: accountSite
      in: query
      required: true
      schema: { type: string, enum: [xianyu] }
    DataType:
      name: dataType
      in: query
      required: true
      schema: { type: string, enum: [json] }
    Timeout20000:
      name: timeout
      in: query
      required: true
      description: 网关超时毫秒数，固定 `20000`。
      schema: { type: string, enum: ['20000'] }
    SessionOptionAutoLoginOnly:
      name: sessionOption
      in: query
      required: true
      schema: { type: string, enum: [AutoLoginOnly] }
    ValueTypeString:
      name: valueType
      in: query
      required: true
      description: 要求平台把 `data` 以字符串形式返回。
      schema: { type: string, enum: [string] }

  responses:
    GatewayError:
      description: |
        非 2xx 的网关 / HTTP 失败。响应体仍可能是带 `ret` 的 JSON 信封；若 `ret` 含 `FAIL_BIZ_`，
        确认发货与免拼接口按终态业务结果处理，其余按 HTTP 错误处理。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MtopEnvelope' }

  schemas:
    MtopEnvelope:
      type: object
      description: MTOP 统一响应信封。项目只读取 `ret` 与 `data`。
      required: [ret]
      properties:
        ret:
          type: array
          description: 业务结果码列表，形如 `SUCCESS::调用成功` 或 `FAIL_SYS_TOKEN_EXOIRED::令牌过期`。
          items: { type: string }
          example: ['SUCCESS::调用成功']
        data:
          type: object
          description: 业务数据；失败时可能缺失或为空对象。
          additionalProperties: true
      additionalProperties: true

    EmptyRequestData:
      type: object
      description: 请求体恒为 `{}`。
      maxProperties: 0
      example: {}

    LoginTokenRequestData:
      type: object
      required: [appKey, deviceId]
      properties:
        appKey:
          type: string
          description: WebSocket 注册用 appKey（与签名 appKey 不同），固定值。
          enum: [444e9908a51d1cb236a27862abc769c9]
        deviceId:
          type: string
          description: 设备 ID，必须与 WS `/reg` 的 `headers.did` 一致；缺省时由 Cookie `unb` 派生。
      additionalProperties: false

    LoginTokenResponseData:
      type: object
      additionalProperties: true
      properties:
        accessToken:
          type: string
          description: 用于 WS `/reg` 注册的令牌；`ret` 含 SUCCESS 但该值为空会被判为异常。
        accessTokenExpiredTime:
          description: 过期时间，形态不固定，项目归一为 Unix 秒。
          oneOf:
            - type: string
              description: RFC3339 时间串、数字串（Unix 秒 / 毫秒）或相对时长。
            - type: number
              description: Unix 秒、Unix 毫秒，或小于 1,000,000 的相对秒数 / 毫秒数。
        url:
          type: string
          description: '`ret` 非 SUCCESS 时的风控验证链接。'

    UserPageNavData:
      type: object
      additionalProperties: true
      properties:
        module:
          type: object
          additionalProperties: true
          properties:
            base:
              type: object
              additionalProperties: true
              properties:
                displayName: { type: string, description: 昵称；为空时回退 `displayNick`。 }
                displayNick: { type: string }
                avatar: { type: string, description: 头像地址。 }

    ChatUserQueryRequestData:
      type: object
      required: [type, sessionType, sessionId, isOwner]
      properties:
        type: { type: integer, enum: [0] }
        sessionType: { type: integer, enum: [1] }
        sessionId: { type: string, description: 会话 ID（不是用户 ID）。 }
        isOwner: { type: boolean, enum: [false] }
      additionalProperties: false

    ChatUserQueryData:
      type: object
      additionalProperties: true
      properties:
        userInfo:
          type: object
          additionalProperties: true
          properties:
            fishNick: { type: string, description: 闲鱼昵称；为空时回退 `nick`。 }
            nick: { type: string }
            logo: { type: string, description: 头像地址。 }

    OrderDetailRequestData:
      type: object
      required: [tid]
      properties:
        tid: { type: string, description: 闲鱼订单号。 }
      additionalProperties: false

    OrderDetailData:
      type: object
      description: |
        结构随页面版本变化，项目递归扫描。下面仅列出会被读取的节点，它们可出现在任意层级；
        也可能以二次编码的 JSON 字符串形式出现。
      additionalProperties: true
      properties:
        utArgs:
          type: object
          additionalProperties: true
          properties:
            orderStatus: { type: string, description: 平台订单状态码，取第一个非空值。 }
        priceInfo:
          type: object
          additionalProperties: true
          properties:
            amount:
              type: object
              additionalProperties: true
              properties:
                value: { type: string, description: 成交金额文本，取第一个非空值。 }
        itemInfo:
          $ref: '#/components/schemas/OrderDetailItemInfo'

    OrderDetailItemInfo:
      type: object
      description: |
        订单商品节点。数量字段为 `buyAmount`；规格有以下几种互相兼容的形态，同时存在时保留维度最多的完整结果：

        1. 成对字段：`specName`/`specValue`、`spec_name`/`spec_value`、`skuName`/`skuValue`、
           `sku_name`/`sku_value`、`propName`/`propValue`、`propertyName`/`propertyValue`；
        2. 组合文本：`skuText`、`sku_text`、`specText`、`spec_text`、`skuDesc`、`skuDescText`，
           形如 `颜色:红色；尺码:L`（名值分隔符 `:`、`：`、`=`，维度分隔符 `；` `;` `,` `|` 换行）；
        3. 结构化数组：`skuProperties`、`sku_properties`、`skuProps`、`sku_props`、`specProperties`、`spec_props`、
           `skuInfo`、`sku_info`、`specInfo`、`spec_info`、`sku`，元素含 `name|specName|spec_name|propName|propertyName`
           与 `value|specValue|spec_value|propValue|propertyValue|text`；
        4. 上述 `skuInfo` 等字段还可以是嵌套对象或文本。

        多维规格的名称与值均以中文分号 `；` 连接且顺序一一对应。
      additionalProperties: true
      properties:
        buyAmount:
          oneOf: [{ type: string }, { type: integer }]
          description: 购买数量；缺失时调用方不得默认为 1。
        specName: { type: string }
        specValue: { type: string }
        skuText: { type: string }
        skuProperties:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              name: { type: string }
              value: { type: string }

    SoldOrdersRequestData:
      type: object
      required: [pageNumber, rowsPerPage, orderIds, queryCode, orderSearchParam]
      properties:
        pageNumber: { type: integer, minimum: 1, default: 1 }
        rowsPerPage:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
          description: 超出 1~100 时项目回落为 30。
        orderIds: { type: string, enum: [''], description: 固定空串（不按订单号过滤）。 }
        queryCode: { type: string, enum: [ALL] }
        orderSearchParam:
          type: string
          enum: ['{}']
          description: 固定为 JSON 文本 `{}`（字符串，不是对象）。
      additionalProperties: false

    SoldOrdersData:
      type: object
      additionalProperties: true
      properties:
        module:
          type: object
          required: [items, nextPage]
          additionalProperties: true
          properties:
            items:
              type: array
              description: 缺失或非数组使整页失败。
              items: { $ref: '#/components/schemas/SoldOrderRow' }
            nextPage:
              description: 是否还有下一页；接受布尔、`0/1`、`true/false/yes/no/1/0` 字符串，其他形态使整页失败。
              oneOf:
                - { type: boolean }
                - { type: integer, enum: [0, 1] }
                - { type: string }
            totalCount:
              oneOf: [{ type: integer }, { type: string }]

    SoldOrderRow:
      type: object
      additionalProperties: true
      properties:
        commonData:
          type: object
          additionalProperties: true
          description: 缺少 `orderId` 的条目使整页解析失败。
          required: [orderId]
          properties:
            orderId: { type: string }
            itemId: { type: string }
            orderStatus:
              type: string
              description: |
                平台中文状态，项目归一为：待付款 / 处理中→processing；待发货 / 已付款→pending_ship；已发货→shipped；
                交易成功 / 已完成→completed；交易关闭 / 已关闭 / 退款关闭 / 退款成功 / 已退款→cancelled；
                退款中→refunding；其余→unknown。`inRefund=true` 时恒为 refunding。
            inRefund: { type: boolean }
            orderCreateTime:
              type: string
              description: |
                创建时间；亦兼容 `order_create_time`、`createTime`、`create_time`、`gmtCreate`、`gmt_create`、`orderTime`、`order_time`，
                也可能位于 `orderInfo`、`orderVO`、`tradeInfo` 子对象内。项目归一为 UTC 的 `YYYY-MM-DD HH:MM:SS`：
                数字串按 Unix 秒（13 位以上为毫秒）解析，无时区文本按东八区解析。
        buyerInfoVO:
          type: object
          additionalProperties: true
          properties:
            buyerId: { type: string }
            name: { type: string, description: 亦兼容 `receiverName`。 }
            phone: { type: string, description: 亦兼容 `receiverPhone`。 }
            address: { type: string, description: 亦兼容 `receiverAddress`。 }
            city: { type: string, description: 亦兼容 `receiverCity`。 }
        priceVO:
          type: object
          additionalProperties: true
          properties:
            totalPrice: { type: string, description: 金额，依次回退 `confirmFee`、`auctionPrice`。 }
            buyNum: { type: string, description: 数量，亦兼容 `quantity`；缺失或 `0` 时项目取 `1`。 }
        rightVO:
          type: object
          additionalProperties: true
          properties:
            btnList:
              type: array
              description: 卖家可用操作按钮；存在 `tradeAction=SKIP_PIN` 的按钮表示砍价订单。
              items:
                type: object
                additionalProperties: true
                properties:
                  tradeAction: { type: string }

    ConsignRequestData:
      type: object
      required: [orderId, tradeText, picList, newUnconsign]
      properties:
        orderId: { type: string, description: 平台订单号。 }
        tradeText: { type: string, description: 买家实际收到的文本发货凭证；无则空串。 }
        picList:
          type: array
          description: 买家实际收到的图片发货凭证地址；无则空数组（不是 null）。
          items: { type: string }
        newUnconsign: { type: boolean, enum: [true], description: 按虚拟商品确认发货处理。 }
      additionalProperties: false

    FreeShippingRequestData:
      type: object
      required: [bizOrderId, itemId, buyerId]
      properties:
        bizOrderId: { type: string, description: 砍价订单业务订单号。 }
        itemId: { type: integer, format: uint64, description: 砍价活动对应的数字商品 ID。 }
        buyerId: { type: integer, format: uint64, description: 参与砍价的数字买家 ID。 }
      additionalProperties: false

    AdjustPriceRequestData:
      type: object
      required: [modifyFee, newTransportFee, orderId]
      properties:
        modifyFee: { type: integer, format: int64, description: 改价后的订单总价，单位为分。 }
        newTransportFee: { type: string, enum: ['0'], description: 运费，固定免运费。 }
        orderId: { type: string, description: 待付款订单号。 }
      additionalProperties: false

    ItemListRequestData:
      type: object
      required: [needGroupInfo, pageNumber, pageSize, groupName, groupId, defaultGroup, userId]
      properties:
        needGroupInfo: { type: boolean, enum: [false] }
        pageNumber: { type: integer, minimum: 1, default: 1 }
        pageSize: { type: integer, minimum: 1, default: 20 }
        groupName: { type: string, enum: [在售] }
        groupId: { type: string, enum: ['58877261'], description: "\"在售\"分组的固定 ID。" }
        defaultGroup: { type: boolean, enum: [true] }
        userId: { type: string, description: 取自 Cookie `unb`。 }
      additionalProperties: false

    ItemListData:
      type: object
      description: |
        **`cardList` 可以缺省**：账号没有在售商品时成功响应可能不带该字段，应按空列表处理。
      additionalProperties: true
      properties:
        cardList:
          type: array
          description: 商品卡片；省略表示空页，显式返回时必须是数组。
          items:
            type: object
            additionalProperties: true
            properties:
              cardType: { type: integer }
              cardData:
                type: object
                additionalProperties: true
                properties:
                  id: { type: string, description: 商品 ID 回退值；`auto_` 前缀为平台占位卡，会被过滤。 }
                  title: { type: string }
                  detailUrl: { type: string }
                  categoryId: { type: string }
                  auctionType: { type: string }
                  itemStatus: { type: integer }
                  priceInfo:
                    type: object
                    additionalProperties: true
                    properties:
                      price: { type: string }
                      preText: { type: string, description: 价格前缀文本（如 ¥）。 }
                  picInfo:
                    type: object
                    additionalProperties: true
                    properties:
                      picUrl: { type: string }
                  detailParams:
                    type: object
                    additionalProperties: true
                    properties:
                      itemId: { type: string }
                      isSKU:
                        description: 真值表示多规格商品；缺失或 false 为单规格。
                        oneOf: [{ type: boolean }, { type: string }, { type: integer }]
                  trackParams: { type: object, additionalProperties: true }
                  itemLabelDataVO: { type: object, additionalProperties: true }
        totalCount:
          description: 总条数；亦可能以 `total_count`、`total` 返回，取第一个正数。
          oneOf: [{ type: integer }, { type: string }]
        pageCount:
          description: 总页数；亦可能以 `page_count`、`totalPages`、`total_pages` 返回，取第一个正数。
          oneOf: [{ type: integer }, { type: string }]

    ChatItemSearchRequestData:
      type: object
      required: [sessionId, pageSize, pageNumber, searchItemRole, queryWord]
      properties:
        sessionId: { type: string, description: 会话 ID。 }
        pageSize: { type: integer, enum: [20] }
        pageNumber: { type: integer, minimum: 1 }
        searchItemRole:
          type: string
          enum: [other, own]
          description: '`other` 查询对方商品，`own` 查询当前账号商品。'
        queryWord: { type: string, description: 搜索关键词，可为空串。 }
      additionalProperties: false

    ChatItemSearchData:
      type: object
      additionalProperties: true
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              itemId: { type: string }
              title: { type: string }
              absoluteMajorPicture: { type: string, description: 主图，可能是协议相对地址 `//...`。 }
              reservePrice: { type: string }
              desc: { type: string }
        nextPage:
          description: 是否还有下一页，接受布尔兼容值。
          oneOf: [{ type: boolean }, { type: integer }, { type: string }]

    PolishRequestData:
      type: object
      required: [itemId]
      properties:
        itemId: { type: string }
      additionalProperties: false

    RateListRequestData:
      type: object
      required: [pageNumber, rowsPerPage, queryType, rateSearchParam]
      properties:
        pageNumber: { type: integer, minimum: 1, default: 1 }
        rowsPerPage: { type: integer, minimum: 1, maximum: 100, default: 50, description: 超出 1~100 时项目回落为 50。 }
        queryType: { type: string, enum: [ORDER] }
        rateSearchParam:
          type: object
          required: [sellerRateStatus]
          properties:
            sellerRateStatus: { type: string, enum: ['5'], description: 待评价状态。 }
          additionalProperties: false
      additionalProperties: false

    RateListData:
      type: object
      additionalProperties: true
      properties:
        module:
          type: object
          additionalProperties: true
          properties:
            items:
              type: array
              description: 订单号与商品号在每个条目内递归查找，键名见接口说明。
              items:
                type: object
                additionalProperties: true

    RateCreateRequestData:
      type: object
      required: [tradeId, rate, feedback, createOrAppend]
      properties:
        tradeId: { type: string, description: 订单号。 }
        rate: { type: integer, enum: [1], description: 1 表示好评。 }
        feedback: { type: string, description: 评价文本；空时项目使用"不错的买家，交易愉快"。 }
        createOrAppend: { type: integer, enum: [0], description: 0 表示新建评价。 }
      additionalProperties: false

    RecommendRequestData:
      type: object
      required: [title, lockCpv, multiSKU, publishScene, scene, description, uniqueCode]
      properties:
        title: { type: string }
        lockCpv: { type: boolean, enum: [false] }
        multiSKU: { type: boolean, enum: [false] }
        publishScene: { type: string, enum: [mainPublish] }
        scene: { type: string, enum: [newPublishChoice] }
        description: { type: string }
        uniqueCode: { type: string, description: 微秒时间戳。 }
        imageInfos:
          type: array
          description: 仅在有图片时携带，首张为主图。
          items: { $ref: '#/components/schemas/PublishImageInfo' }
      additionalProperties: false

    RecommendData:
      type: object
      additionalProperties: true
      properties:
        categoryPredictResult: { $ref: '#/components/schemas/PublishCategoryDTO' }
        cardList:
          type: array
          description: 分类卡列表，`categoryPredictResult` 无效时的回退来源。
          items:
            type: object
            additionalProperties: true
            properties:
              cardData:
                type: object
                additionalProperties: true
                properties:
                  propertyId: { type: string }
                  propertyName: { type: string }
                  valuesList:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        catId: { type: string }
                        catName: { type: string }
                        channelCatId: { type: string }
                        tbCatId: { type: string }
                        isClicked:
                          description: 是否被推荐选中，接受布尔、`1`、`true`。
                          oneOf: [{ type: boolean }, { type: string }, { type: integer }]

    PublishCategoryDTO:
      type: object
      additionalProperties: true
      properties:
        catId: { type: string }
        catName: { type: string }
        channelCatId: { type: string }
        tbCatId: { type: string }

    PublishImageInfo:
      type: object
      required: [extraInfo, isQrCode, url, heightSize, widthSize, major, type, status]
      properties:
        extraInfo:
          type: object
          properties:
            isH: { type: string, enum: ['false'] }
            isT: { type: string, enum: ['false'] }
            raw: { type: string, enum: ['false'] }
        isQrCode: { type: boolean, enum: [false] }
        url: { type: string, description: 图片上传接口返回的地址。 }
        heightSize: { type: integer }
        widthSize: { type: integer }
        major: { type: boolean, description: 是否主图，仅第一张为 true。 }
        type: { type: integer, enum: [0] }
        status: { type: string, enum: [done] }

    PublishRequestData:
      type: object
      required: [freebies, itemTypeStr, quantity, simpleItem, imageInfoDOList, itemTextDTO, itemLabelExtList, itemPriceDTO, userRightsProtocols, itemPostFeeDTO, defaultPrice, itemCatDTO, uniqueCode, sourceId, bizcode, publishScene]
      properties:
        freebies: { type: boolean, enum: [false] }
        itemTypeStr: { type: string, enum: [b] }
        quantity: { type: string, description: 库存数量的十进制字符串。 }
        simpleItem: { type: string, enum: ['true'], description: 字符串而非布尔。 }
        imageInfoDOList:
          type: array
          items: { $ref: '#/components/schemas/PublishImageInfo' }
        itemTextDTO:
          type: object
          required: [desc, title, titleDescSeparate]
          properties:
            desc: { type: string }
            title: { type: string }
            titleDescSeparate: { type: boolean, enum: [false] }
        itemLabelExtList:
          type: array
          description: 由类目推荐里被选中的标签生成。
          items:
            type: object
            additionalProperties: true
            properties:
              channelCateName: { type: string }
              channelCateId: { type: string }
              tbCatId: { type: string }
              labelType: { type: string, enum: [common] }
              propertyName: { type: string }
              propertyId: { type: string }
              isUserClick: { type: string, enum: ['1'] }
              from: { type: string, enum: [newPublishChoice] }
              labelFrom: { type: string, enum: [newPublish] }
              text: { type: string }
              properties: { type: string, description: '`{propertyId}##{propertyName}:{channelCatId}##{catName}`。' }
        itemPriceDTO:
          type: object
          description: 多规格时省略 `priceInCent`。
          properties:
            priceInCent: { type: string, description: 售价，单位为分的十进制字符串。 }
            origPriceInCent: { type: string, description: 原价，单位为分；仅 >0 时携带。 }
        userRightsProtocols:
          type: array
          items:
            type: object
            properties:
              enable: { type: boolean, enum: [false] }
              serviceCode: { type: string, enum: [SKILL_PLAY_NO_MIND] }
        itemPostFeeDTO: { $ref: '#/components/schemas/PostFeeDTO' }
        defaultPrice: { type: boolean, enum: [false] }
        itemCatDTO: { $ref: '#/components/schemas/PublishCategoryDTO' }
        uniqueCode: { type: string, description: 微秒时间戳。 }
        sourceId: { type: string, enum: [pcMainPublish] }
        bizcode: { type: string, enum: [pcMainPublish] }
        publishScene: { type: string, enum: [pcMainPublish] }
        itemProperties:
          type: array
          description: 仅多规格商品携带。
          items:
            type: object
            properties:
              propertyName: { type: string }
              supportImage: { type: boolean }
              propertyValues:
                type: array
                items:
                  type: object
                  properties:
                    propertyValue: { type: string }
                    propertyValueImg: { $ref: '#/components/schemas/PropertyValueImage' }
        itemSkuList:
          type: array
          description: 仅多规格商品携带，长度必须等于规格值组合数。
          items:
            type: object
            properties:
              priceInCent: { type: string }
              quantity: { type: integer }
              propertyList:
                type: array
                items:
                  type: object
                  properties:
                    propertyText: { type: string }
                    valueText: { type: string }
        propertyImageList:
          type: array
          description: 仅多规格且存在规格图时携带。
          items:
            type: object
            properties:
              property:
                type: object
                properties:
                  propertyText: { type: string }
                  valueText: { type: string }
              url: { type: string }
        itemAddrDTO:
          type: object
          description: 发货地；实物商品必填，虚拟商品可省略。
          properties:
            area: { type: string }
            city: { type: string }
            divisionId: { type: string }
            gps: { type: string, description: '`纬度,经度`。' }
            poiId: { type: string }
            poiName: { type: string }
            prov: { type: string }
      additionalProperties: false

    PropertyValueImage:
      type: object
      properties:
        url: { type: string }
        thumbnail: { type: string }
        status: { type: string, enum: [done] }
        major: { type: boolean, enum: [false] }
        widthSize: { type: integer }
        heightSize: { type: integer }
        type: { type: integer, enum: [0] }
        extraInfo: { type: object, additionalProperties: true }
        isQrCode: { type: boolean, enum: [false] }
        labels: { type: array, items: {} }
        templateIndex: { type: string, enum: ['0'] }

    PostFeeDTO:
      type: object
      description: |
        运费模式映射：`free`（默认）→ `canFreeShipping=true, supportFreight=true`；
        `distance` → `supportFreight=true, templateId="-100"`；
        `fixed` → `supportFreight=true, postPriceInCent, templateId="0"`；
        `none` → `templateId="0"`（不支持运费）。
      required: [canFreeShipping, supportFreight, onlyTakeSelf]
      properties:
        canFreeShipping: { type: boolean }
        supportFreight: { type: boolean }
        onlyTakeSelf: { type: boolean, enum: [false] }
        templateId: { type: string }
        postPriceInCent: { type: string, description: 固定运费，单位为分。 }

    UploadImageResponse:
      type: object
      additionalProperties: true
      description: 图片地址按 `object.url` → `data.url` → `url` 的顺序取第一个非空。
      properties:
        object:
          type: object
          additionalProperties: true
          properties:
            url: { type: string }
            pix: { type: string, description: '宽高，形如 `800x600`。', pattern: '^[0-9]+x[0-9]+$' }
        data:
          type: object
          additionalProperties: true
          properties:
            url: { type: string }
        url: { type: string }

