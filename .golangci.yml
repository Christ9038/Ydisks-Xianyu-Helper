# golangci-lint v2 配置。
# 聚焦 bug-finder 类 linter 作为质量门禁；风格类（revive/gocritic）噪声大，暂不启用。
# browser 包依赖 Chromium 且用 playwright 弃用 API（待迁移），单独排除。
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck        # 检查未处理的错误返回值
    - govet           # go vet 综合检查
    - ineffassign     # 检测无效赋值
    - staticcheck     # 综合静态分析（含原 gosimple 检查）
    - unused          # 检测未使用的代码
    - misspell        # 拼写检查
    - gocyclo         # 检查函数分支复杂度，阶段 10 收口高风险热点

  settings:
    errcheck:
      # 清理路径上的 Close/Rollback，错误无可挽回，惯例忽略。
      exclude-functions:
        - (*os.File).Close
        - (*os.Root).Close
        - (io.Closer).Close
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback
        - (*bufio.Writer).Flush
    gocyclo:
      # 50 以上才视为需要结构拆分的生产热点；测试编排不以断言数量伪装业务复杂度债务。
      min-complexity: 50

  exclusions:
    presets:
      - common-false-positives
    rules:
      # browser 包：playwright 弃用 API 待整体迁移到 locator，暂不 lint。
      - path: internal/browser/
        linters: [errcheck, staticcheck, govet]
      # 测试代码允许在 setup 中忽略错误。
      - path: _test\.go
        linters: [errcheck, gocyclo]
      # cmd/spike 是一次性诊断脚本，放宽要求。
      - path: cmd/spike/
        linters: [errcheck]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
