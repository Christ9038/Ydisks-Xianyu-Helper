x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-xianyu}:${POSTGRES_PASSWORD:-xianyu_password}@postgres:5432/${POSTGRES_DB:-xianyu}?sslmode=disable
  TZ: ${TZ:-Asia/Shanghai}
  BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
  PLAYWRIGHT_DRIVER_PATH: ${PLAYWRIGHT_DRIVER_PATH:-/ms-playwright-go}
  PLAYWRIGHT_NODEJS_PATH: ${PLAYWRIGHT_NODEJS_PATH:-/usr/bin/node}
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ${PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD:-1}
  PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH:-/usr/bin/chromium}
  XIANYU_ADMIN_PASSWORD: ${XIANYU_ADMIN_PASSWORD:-}

x-app-volumes: &app-volumes
  - app_data:/app/data
  - browser_data:/app/browser_data

services:
  postgres:
    image: postgres:17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xianyu}
      POSTGRES_USER: ${POSTGRES_USER:-xianyu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xianyu_password}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${XIANYU_IMAGE:-xianyu-go:debian13}
    build:
      context: .
      dockerfile: Dockerfile.debian13
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-env
    command: ["/app/xianyu-server", "-addr", ":8080"]
    ports:
      - "${XIANYU_HTTP_PORT:-8080}:8080"
    volumes: *app-volumes
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  init-admin:
    image: ${XIANYU_IMAGE:-xianyu-go:debian13}
    build:
      context: .
      dockerfile: Dockerfile.debian13
    profiles: ["init"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-env
    command:
      - /bin/sh
      - -c
      - >-
        test -n "$$XIANYU_ADMIN_PASSWORD" ||
        { echo "XIANYU_ADMIN_PASSWORD is required"; exit 1; };
        exec /app/xianyu-server -init-admin -admin-password "$$XIANYU_ADMIN_PASSWORD"
    volumes: *app-volumes

volumes:
  postgres_data:
  app_data:
  browser_data:
