components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  schemas:
    ApiResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
      description: 统一响应的稳定字段；业务成功字段由各阶段 operation schema 收紧。
    SessionResponse:
      type: object
      required: [success, message, is_admin]
      properties:
        success:
          type: boolean
        token:
          type: [string, 'null']
        message:
          type: string
        user_id:
          type: integer
        username:
          type: string
        is_admin:
          type: boolean
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        email:
          type: string
        verification_code:
          type: string
    InitializeRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
    PasswordChangeRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
    PasswordLoginDisabledRequest:
      type: object
      properties:
        account_id:
          type: string
        account:
          type: string
        password:
          type: string
        show_browser:
          type: boolean
    CredentialUpdateRequest:
      type: object
      required: [current_password, new_username]
      properties:
        current_password:
          type: string
        new_username:
          type: string
        new_password:
          type: string
    QRLoginVerificationRequest:
      type: object
      properties:
        target_account_id:
          type: string
    EmptyRequest:
      type: object
      additionalProperties: false
    AccountIDList:
      type: array
      items:
        type: string
    AccountCreateRequest:
