components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  schemas:
    ApiResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
      description: 统一响应的稳定字段；业务成功字段由各阶段 operation schema 收紧。
    NotificationUncertainOutboxItem:
      type: object
      required: [id, channel_id, event_type, attempt_count, uncertain_at, has_error]
      properties:
        id: {type: integer}
        channel_id: {type: integer}
        owner_user_id: {type: integer}
        event_type: {type: string}
        attempt_count: {type: integer}
        uncertain_at: {type: integer}
        has_error: {type: boolean}
    NotificationUncertainOutboxResponse:
      type: object
      required: [total, items]
      properties:
        total: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/NotificationUncertainOutboxItem'}}
    AutomationRunIssue:
      type: object
      required: [id, cookie_id, order_id, trigger_type, error_message, issue_kind, allowed_resolutions, action_cursor, sent_count, updated_at]
      properties:
        id: {type: integer}
        cookie_id: {type: string}
        order_id: {type: string}
        trigger_type: {type: string}
        error_message: {type: string}
        issue_kind: {type: string}
        allowed_resolutions: {type: array, items: {type: string}}
        action_cursor: {type: integer}
        sent_count: {type: integer}
        updated_at: {type: string}
    DeferredAutomationIssue:
      type: object
      required: [id, cookie_id, trigger_type, error_message, attempt_count, updated_at]
      properties:
        id: {type: integer}
        cookie_id: {type: string}
        trigger_type: {type: string}
        error_message: {type: string}
        attempt_count: {type: integer}
        updated_at: {type: string}
    AutomationIssuesResponse:
      type: object
      required: [runs, pending_tasks]
      properties:
        runs: {type: array, items: {$ref: '#/components/schemas/AutomationRunIssue'}}
        pending_tasks: {type: array, items: {$ref: '#/components/schemas/DeferredAutomationIssue'}}
    AutomationActionResponse:
      type: object
      required: [id, action_type, card_id, card_name, delivery_count, message_template, delay_seconds, config_json, enabled, sort_order]
      properties:
        id: {type: integer}
        action_type: {type: string}
        card_id: {type: integer}
        card_name: {type: string}
        delivery_count: {type: integer}
        message_template: {type: string}
        delay_seconds: {type: integer}
        config_json: {type: string}
        enabled: {type: boolean}
        sort_order: {type: integer}
    AutomationRuleResponse:
      type: object
      required: [id, cookie_id, item_id, item_title, name, trigger_type, enabled, priority, config_json, actions, created_at, updated_at]
      properties:
        id: {type: integer}
        cookie_id: {type: string}
        item_id: {type: string}
        item_title: {type: string}
        name: {type: string}
        trigger_type: {type: string}
        enabled: {type: boolean}
        priority: {type: integer}
        config_json: {type: string}
        actions: {type: array, items: {$ref: '#/components/schemas/AutomationActionResponse'}}
        created_at: {type: string}
        updated_at: {type: string}
    AutomationRuleListResponse:
      type: array
      items: {$ref: '#/components/schemas/AutomationRuleResponse'}
    AutomationRulePageResponse:
      type: object
      required: [success, data, total, page, page_size, total_pages, trigger_counts]
      properties:
        success: {type: boolean}
        data: {type: array, items: {$ref: '#/components/schemas/AutomationRuleResponse'}}
        total: {type: integer}
        page: {type: integer}
        page_size: {type: integer}
        total_pages: {type: integer}
        trigger_counts:
